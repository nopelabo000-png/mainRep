<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Bridge — Glasses</title>
<style>
  /* 単眼グリーンHUD前提: 黒地・高コントラスト・大きめ文字 */
  html,body{margin:0;height:100%;background:#000;color:#33ff88;
    font-family:monospace;display:flex;align-items:center;justify-content:center}
  .hud{text-align:center;max-width:640px;padding:16px}
  h1{font-size:34px;margin:0 0 10px;letter-spacing:1px}
  #status{font-size:28px;line-height:1.5;color:#7dffb8;white-space:pre-line}
  #detail{font-size:16px;color:#1f8a4c;margin-top:14px}
  button{margin-top:18px;font-size:26px;padding:10px 26px;background:#33ff88;
    color:#04140b;border:0;border-radius:10px;font-family:inherit;font-weight:700}
</style>
</head>
<body>
<div class="hud">
  <h1>MEET BRIDGE</h1>
  <div id="status">タップして開始</div>
  <div id="detail"></div>
  <button id="start">開始</button>
</div>
<script>
'use strict';
/**
 * グラス側クライアント。
 * カメラ+マイクを取得して PC の Chrome 拡張へ WebRTC 送信し(=Meetのカメラ/マイク)、
 * 拡張から返る Meet の受話音声をこの端末のスピーカーで再生する(=Meetのスピーカー)。
 * シグナリングは同一オリジンの bridge-server (ws) 経由。?room=xxx で分離。
 */
const q = new URLSearchParams(location.search);
const ROOM = q.get('room') || 'default';
const statusEl = document.getElementById('status');
const detailEl = document.getElementById('detail');
const startBtn = document.getElementById('start');

const set = (s, d) => { statusEl.textContent = s; if (d !== undefined) detailEl.textContent = d; };

let ws, pc, localStream;
const remoteAudio = new Audio();
remoteAudio.autoplay = true;

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'hello', role: 'glasses', room: ROOM }));
    set('PC側の接続を待機中…', `room: ${ROOM}`);
  };
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'peer-ready') set('PC検出。ネゴシエーション中…');
    else if (m.type === 'offer') await onOffer(m);
    else if (m.type === 'ice' && pc) { try { await pc.addIceCandidate(m.candidate); } catch {} }
    else if (m.type === 'peer-left') set('PC切断。待機中…');
    else if (m.type === 'replaced') set('別のグラスに置き換えられました');
  };
  ws.onclose = () => { set('シグナリング切断。3秒後に再接続'); setTimeout(connectWs, 3000); };
}

function newPc() {
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  for (const t of localStream.getTracks()) pc.addTrack(t, localStream);
  pc.onicecandidate = (e) => {
    if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
  };
  pc.ontrack = (e) => { // Meet の受話音声 → グラスのスピーカー
    remoteAudio.srcObject = e.streams[0] || new MediaStream([e.track]);
    remoteAudio.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === 'connected') set('● 通話ブリッジ中', 'カメラ/マイク→Meet, 受話→スピーカー');
    else if (st === 'failed' || st === 'disconnected') set('P2P切断。再接続待ち…');
  };
}

async function onOffer(m) {
  newPc(); // 拡張は再ネゴ時も新規offerを送るため毎回作り直す
  await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
}

startBtn.onclick = async () => {
  startBtn.remove();
  try {
    set('カメラ/マイク取得中…');
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24 } },
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    return set('カメラ/マイク取得失敗', String(e));
  }
  connectWs();
};
</script>
</body>
</html>
