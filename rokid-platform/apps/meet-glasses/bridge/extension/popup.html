<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body{width:300px;margin:0;padding:14px;background:#0a0e0c;color:#d6f5e4;
    font-family:system-ui,sans-serif;font-size:13px}
  h1{font-size:14px;color:#33ff88;margin:0 0 12px}
  label{display:block;color:#6f8a7c;margin:10px 0 4px}
  input[type=text]{width:100%;box-sizing:border-box;background:#0f1613;color:#d6f5e4;
    border:1px solid #1c2b22;border-radius:6px;padding:7px 9px;font-size:13px}
  .toggle{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
  button{margin-top:14px;width:100%;padding:9px;background:#33ff88;color:#04140b;
    border:0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
  #saved{color:#33ff88;font-size:12px;min-height:16px;margin-top:6px;text-align:center}
  .hint{color:#6f8a7c;font-size:11px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<h1>◉ Rokid Meet Bridge</h1>

<label>ブリッジサーバー (ws://)</label>
<input type="text" id="server" placeholder="ws://192.168.1.20:8787/ws">

<label>ルーム</label>
<input type="text" id="room" placeholder="default">

<div class="toggle">
  <input type="checkbox" id="enabled">
  <label for="enabled" style="margin:0;color:#d6f5e4">グラスをカメラ/マイク/スピーカーにする</label>
</div>

<button id="save">保存</button>
<div id="saved"></div>

<p class="hint">
  1. PC で <code>node bridge-server.js</code> を起動<br>
  2. グラスのブラウザで <code>http://&lt;PCのIP&gt;:8787/</code> を開き「開始」<br>
  3. ここを有効化して Meet に参加(または再読み込み)
</p>

<script src="popup.js"></script>
</body>
</html>
