plugins { id 'com.android.application' }

android {
    namespace 'com.rokid.meetglass'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rokid.meetglass'
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }

        // OAuth クライアント情報 (Meet Media API の利用に必須)
        // local.properties / 環境変数から注入する想定
        buildConfigField "String", "GOOGLE_OAUTH_CLIENT_ID", "\"${project.findProperty('meetClientId') ?: ''}\""
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Rokid: 音声コマンド / HUD / センサー
    implementation 'com.rokid.cxr:cxr-service-bridge:1.0-SNAPSHOT'

    // WebRTC: Meet Media API への直接メディア接続 (音声/映像)
    // 公式リファレンスクライアントは WebRTC をベースにしている
    implementation 'io.github.webrtc-sdk:android:125.6422.07'

    // Google 認証 (OAuth2 アクセストークン取得)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'

    // HTTP / JSON (Meet REST: スペース作成・参加トークン交換)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.core:core:1.13.1'
}
